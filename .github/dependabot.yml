version: 2

updates:
  # Workflow action versions — this is what went stale last time.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # The app ships no runtime dependencies beyond React, so nearly everything
    # here is build tooling. One grouped PR a week beats a dozen singles.
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      build-tooling:
        patterns: ['vite', '@vitejs/*', 'vitest', 'typescript']
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5
